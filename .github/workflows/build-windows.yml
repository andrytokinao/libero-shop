name: Build Windows Installer

on:
  push:
    branches:
      - "release-*"
  workflow_dispatch:
    inputs:
      publish_to_site:
        description: "Envoyer le zip et la mise à jour sur le site web ?"
        type: boolean
        default: false
      notes:
        description: "Notes de version affichées dans la mise à jour (facultatif)"
        required: false
        default: ""

permissions:
  contents: read

env:
  APP_NAME: libero-shop                                        # nom de base de l'application (minuscules, tirets)
  VIDEO_PATH: assets/video/demo.mp4                            # vidéo optionnelle, ignorée si absente
  UPLOAD_URL: https://www.kinga-digital.com/api/upload-release # URL de l'API d'upload (sans le nom de l'app)
  SITE_URL: https://www.kinga-digital.com                      # utilisé pour afficher les liens publics

jobs:
  build-windows:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.ver.outputs.version }}
      pom_version: ${{ steps.ver.outputs.pom_version }}
      variant: ${{ steps.ver.outputs.variant }}
      app: ${{ steps.ver.outputs.app }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout (branche courante)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Lire la version du pom (source unique)
        id: ver
        shell: pwsh
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          # Version du projet (pas celle du parent Spring Boot)
          [xml]$pom = Get-Content -Path pom.xml -Raw -Encoding UTF8
          $pomVersion = ([string]$pom.project.version).Trim()

          # Formats acceptés : 1.0.7  ou  moussa-1.0.6
          if ($pomVersion -notmatch '^(?:(?<variant>[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*?)-)?(?<version>\d+\.\d+\.\d+)$') {
            Write-Error "Version du pom '$pomVersion' invalide. Formats attendus : 1.0.7 ou moussa-1.0.6 (pas de SNAPSHOT)"
            exit 1
          }
          $v = [string]$Matches['version']
          $variant = ([string]$Matches['variant']).ToLower()

          $app = $env:APP_NAME
          if ($variant) { $app = "$app-$variant" }

          # Simple avertissement si la branche ne correspond pas au pom
          $rest = $env:BRANCH_NAME -replace '^release[-/]', ''
          if ($rest -ne $pomVersion) {
            Write-Host "::warning::La branche '$($env:BRANCH_NAME)' ne correspond pas à la version du pom '$pomVersion'. Le pom fait foi."
          }

          "version=$v" >> $env:GITHUB_OUTPUT
          "pom_version=$($pomVersion.ToLower())" >> $env:GITHUB_OUTPUT
          "variant=$variant" >> $env:GITHUB_OUTPUT
          "app=$app" >> $env:GITHUB_OUTPUT
          Write-Host "Pom : $pomVersion -> Application : $app, Version Windows : $v"

      # La clé publique de vérification des mises à jour vient de la variable UPDATE_PUBLIC_KEY.
      # Elle est écrite dans la ressource lue par EmbeddedUpdateKey AVANT le build (tests inclus),
      # donc elle est compilée dans le jar. Pas de filtrage Maven, pas de placeholder.
      - name: Injecter la clé publique de mise à jour
        shell: pwsh
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          $key = ([string]$env:UPDATE_PUBLIC_KEY) -replace '\s', ''
          if (-not $key) {
            Write-Error "Variable UPDATE_PUBLIC_KEY absente ou vide (Settings > Secrets and variables > Actions > onglet Variables)."
            exit 1
          }
          if ($key -notmatch '^[A-Za-z0-9+/]{43,}={0,2}$') {
            Write-Error "UPDATE_PUBLIC_KEY n'est pas du Base64 valide."
            exit 1
          }
          $enc = New-Object System.Text.UTF8Encoding($false)
          $target = Join-Path (Get-Location) "src/main/resources/update-key.properties"
          [IO.File]::WriteAllText($target, "public.key=$key`n", $enc)
          Write-Host "Clé publique injectée : $key"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install WiX Toolset 3 (si absent)
        shell: pwsh
        run: choco install wixtoolset -y --no-progress
        continue-on-error: true

      - name: Build installer (profil installer)
        shell: pwsh
        run: |
          Write-Host "Version envoyée à jpackage (installer.version) : ${{ steps.ver.outputs.version }}"
          mvn -B -P installer "-Dinstaller.version=${{ steps.ver.outputs.version }}" -DtrimStackTrace=false clean verify

      # Contrôle final : la clé qui est réellement dans le jar livré est bien celle de la variable.
      - name: Vérifier la clé embarquée dans le jar
        shell: pwsh
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          $expected = ([string]$env:UPDATE_PUBLIC_KEY) -replace '\s', ''
          $jar = Get-ChildItem -Path target/jpackage/input -Filter *.jar -File | Select-Object -First 1
          if (-not $jar) {
            Write-Error "Aucun jar dans backend/target/jpackage/input"
            exit 1
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($jar.FullName)
          try {
            $entry = $zip.GetEntry("BOOT-INF/classes/update-key.properties")
            if (-not $entry) {
              Write-Error "update-key.properties introuvable dans $($jar.Name)"
              exit 1
            }
            $reader = New-Object System.IO.StreamReader($entry.Open())
            try { $content = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally {
            $zip.Dispose()
          }
          if ($content -notmatch [regex]::Escape("public.key=$expected")) {
            Write-Error "La clé embarquée dans le jar ne correspond pas à UPDATE_PUBLIC_KEY."
            exit 1
          }
          Write-Host "OK : le jar embarque la clé publique attendue."

      - name: Préparer le contenu du zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          $installers = Get-ChildItem -Recurse -Path target -Include *.exe,*.msi -File
          if (-not $installers) {
            Write-Error "Aucun installateur (.exe/.msi) trouvé dans backend/target"
            exit 1
          }
          $installers | ForEach-Object {
            Write-Host "Installateur : $($_.FullName)"
            Copy-Item $_.FullName -Destination $staging
          }

          $video = Join-Path $env:GITHUB_WORKSPACE $env:VIDEO_PATH
          if (Test-Path $video) {
            Copy-Item $video -Destination $staging
            Write-Host "Vidéo ajoutée : $video"
          } else {
            Write-Host "Pas de vidéo trouvée à $video, ignorée."
          }

          Get-ChildItem $staging | Select-Object Name, Length

      - name: Upload artifact (contenu à la racine)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.app }}-${{ steps.ver.outputs.version }}
          path: staging/*
          if-no-files-found: error
          retention-days: 30

      # Le payload de la mise à jour : le jar obfusqué que jpackage a embarqué dans l'installateur
      # (copié par stage-jpackage-input dans target/jpackage/input), identique octet pour octet.
      - name: Préparer le payload de la mise à jour
        shell: pwsh
        run: |
          $jars = Get-ChildItem -Path target/jpackage/input -Filter *.jar -File
          if (-not $jars) {
            Write-Error "Aucun jar trouvé dans backend/target/jpackage/input"
            exit 1
          }
          if ($jars.Count -gt 1) {
            Write-Error "Plusieurs jars dans target/jpackage/input : $($jars.Name -join ', ')"
            exit 1
          }
          $dir = Join-Path $env:GITHUB_WORKSPACE "update-payload"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $jars[0].FullName -Destination (Join-Path $dir "payload.bin")
          Write-Host "Payload : $($jars[0].Name) ($([math]::Round($jars[0].Length / 1MB, 1)) Mo)"

      - name: Upload payload (pour le job de publication)
        uses: actions/upload-artifact@v4
        with:
          name: payload-${{ steps.ver.outputs.app }}-${{ steps.ver.outputs.version }}
          path: update-payload/payload.bin
          if-no-files-found: error
          retention-days: 1

  publish-site:
    needs: build-windows
    if: ${{ github.event_name == 'push' || inputs.publish_to_site }}
    runs-on: ubuntu-latest

    # Les secrets ne sont PAS ici : chaque étape déclare uniquement ceux dont elle a besoin,
    # pour qu'ils ne soient pas visibles des actions tierces (download-artifact).
    env:
      APP: ${{ needs.build-windows.outputs.app }}
      VERSION: ${{ needs.build-windows.outputs.version }}
      POM_VERSION: ${{ needs.build-windows.outputs.pom_version }}
      RELEASE_NOTES: ${{ inputs.notes }}

    steps:
      # Tout est vérifié AVANT de publier quoi que ce soit : si un contrôle échoue, rien n'est envoyé.
      - name: Vérifier la clé de signature et le site
        env:
          KINGA_UPLOAD_TOKEN: ${{ secrets.KINGA_UPLOAD_TOKEN }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          EXPECTED_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          # 1. Clé de signature présente, lisible et de type Ed25519
          if [ -z "${UPDATE_SIGNING_KEY:-}" ]; then
            echo "::error::Secret UPDATE_SIGNING_KEY absent ou vide. Créez-le dans Settings > Secrets and variables > Actions (Repository secrets). Rien n'a été publié."
            exit 1
          fi
          if [ -z "${KINGA_UPLOAD_TOKEN:-}" ]; then
            echo "::error::Secret KINGA_UPLOAD_TOKEN absent ou vide. Rien n'a été publié."
            exit 1
          fi

          umask 077
          KEY="${RUNNER_TEMP}/update-key.pem"
          printf '%s' "$UPDATE_SIGNING_KEY" > "${KEY}.raw"
          if grep -q 'BEGIN' "${KEY}.raw"; then
            cp "${KEY}.raw" "$KEY"
          else
            {
              echo "-----BEGIN PRIVATE KEY-----"
              tr -d ' \r\n' < "${KEY}.raw" | fold -w 64
              echo
              echo "-----END PRIVATE KEY-----"
            } > "$KEY"
          fi
          rm -f "${KEY}.raw"

          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::UPDATE_SIGNING_KEY n'est pas une clé privée lisible (PEM PKCS8 non chiffré attendu). Rien n'a été publié."
            exit 1
          fi
          if ! openssl pkey -in "$KEY" -noout -text | grep -qi 'ED25519'; then
            echo "::error::UPDATE_SIGNING_KEY n'est pas une clé Ed25519. Rien n'a été publié."
            exit 1
          fi

          # La clé privée doit correspondre à la clé publique embarquée dans l'application,
          # sinon toutes les installations refuseraient la mise à jour.
          DERIVED="$(openssl pkey -in "$KEY" -pubout -outform DER | base64 -w0)"
          EXPECTED="$(printf '%s' "${EXPECTED_PUBLIC_KEY:-}" | tr -d ' \r\n')"
          echo "Clé publique déduite du secret : $DERIVED"
          if [ -z "$EXPECTED" ] || [ "$DERIVED" != "$EXPECTED" ]; then
            echo "::error::UPDATE_SIGNING_KEY ne correspond pas à UPDATE_PUBLIC_KEY (la clé embarquée dans l'application). Rien n'a été publié."
            exit 1
          fi

          # 2. Le site a bien la route d'upload qui accepte les mises à jour (.lsu).
          # Cette requête est refusée avant toute écriture : elle ne crée aucun fichier.
          RESPONSE="$(curl -sS -X POST "${UPLOAD_URL%/}/${APP}" \
            -H "Authorization: Bearer ${KINGA_UPLOAD_TOKEN}" \
            --form-string "kind=probe" \
            --form-string "version=0.0.0" || true)"
          echo "Réponse du site : ${RESPONSE}"
          case "$RESPONSE" in
            *"Type de fichier invalide"*)
              echo "Le site accepte les mises à jour (.lsu)."
              ;;
            *)
              echo "::error::Le site n'a pas la route d'upload à jour (réponse inattendue ci-dessus). Causes possibles : site non redéployé, token incorrect (401), application absente de ALLOWED_APPS (403). Rien n'a été publié."
              exit 1
              ;;
          esac

      - name: Télécharger l'artifact (installateur)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.app }}-${{ needs.build-windows.outputs.version }}
          path: dist

      - name: Créer le zip
        run: |
          cd dist
          zip -r "../${APP}-${VERSION}.zip" .
          cd ..
          ls -lh "${APP}-${VERSION}.zip"

      - name: Envoyer le zip par POST
        env:
          KINGA_UPLOAD_TOKEN: ${{ secrets.KINGA_UPLOAD_TOKEN }}
        run: |
          ZIP="${APP}-${VERSION}.zip"
          echo "Envoi vers ${UPLOAD_URL%/}/${APP}"
          curl --fail-with-body -sS \
            --retry 3 --retry-all-errors --retry-delay 5 \
            -X POST "${UPLOAD_URL%/}/${APP}" \
            -H "Authorization: Bearer ${KINGA_UPLOAD_TOKEN}" \
            -F "version=${VERSION}" \
            -F "file=@${ZIP};type=application/zip"

      - name: Télécharger le payload de la mise à jour
        uses: actions/download-artifact@v4
        with:
          name: payload-${{ needs.build-windows.outputs.app }}-${{ needs.build-windows.outputs.version }}
          path: payload

      - name: Fabriquer, signer et envoyer la mise à jour (.lsu)
        env:
          KINGA_UPLOAD_TOKEN: ${{ secrets.KINGA_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail

          umask 077
          KEY="${RUNNER_TEMP}/update-key.pem"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          openssl pkey -in "$KEY" -pubout -out "$WORK/pub.pem"

          # --- Payload et manifeste ---
          cp payload/payload.bin "$WORK/payload.bin"
          SHA256="$(sha256sum "$WORK/payload.bin" | cut -d' ' -f1)"
          RELEASED_ON="$(date -u +%F)"
          NOTES="${RELEASE_NOTES:-Version ${POM_VERSION}}"

          jq -nc \
            --arg appVersion "$POM_VERSION" \
            --arg payloadSha256 "$SHA256" \
            --arg releasedOn "$RELEASED_ON" \
            --arg notes "$NOTES" \
            '{appVersion:$appVersion, payloadSha256:$payloadSha256, releasedOn:$releasedOn, notes:$notes}' \
            | tr -d '\n' > "$WORK/manifest.json"
          echo "Manifeste : $(cat "$WORK/manifest.json")"

          # --- Signature Ed25519 des octets exacts du manifeste ---
          openssl pkeyutl -sign -rawin -inkey "$KEY" -in "$WORK/manifest.json" -out "$WORK/signature.bin"
          openssl pkeyutl -verify -rawin -pubin -inkey "$WORK/pub.pem" -in "$WORK/manifest.json" -sigfile "$WORK/signature.bin"

          MANIFEST_B64URL="$(base64 -w0 "$WORK/manifest.json" | tr '+/' '-_' | tr -d '=')"
          SIGNATURE_B64="$(base64 -w0 "$WORK/signature.bin")"

          jq -nc \
            --arg manifest "$MANIFEST_B64URL" \
            --arg signature "$SIGNATURE_B64" \
            '{format:"libero-shop-update", version:1, algorithm:"Ed25519", manifest:$manifest, signature:$signature}' \
            > "$WORK/envelope.json"

          # --- Archive .lsu : envelope.json et payload.bin à la racine ---
          LSU="${GITHUB_WORKSPACE}/${APP}-${VERSION}.lsu"
          (cd "$WORK" && zip -X -q "$LSU" envelope.json payload.bin)
          unzip -l "$LSU"
          ls -lh "$LSU"

          # --- Envoi : le site publie ${APP}-${VERSION}.lsu, ${APP}-latest.lsu et latest.json ---
          echo "Envoi de la mise à jour vers ${UPLOAD_URL%/}/${APP}"
          curl --fail-with-body -sS \
            --retry 3 --retry-all-errors --retry-delay 5 \
            -X POST "${UPLOAD_URL%/}/${APP}" \
            -H "Authorization: Bearer ${KINGA_UPLOAD_TOKEN}" \
            --form-string "kind=lsu" \
            --form-string "version=${VERSION}" \
            --form-string "app_version=${POM_VERSION}" \
            --form-string "released_on=${RELEASED_ON}" \
            --form-string "notes=${NOTES}" \
            -F "file=@${LSU};type=application/octet-stream"

      - name: Supprimer la clé de signature du runner
        if: always()
        run: shred -u "${RUNNER_TEMP}/update-key.pem" 2>/dev/null || rm -f "${RUNNER_TEMP}/update-key.pem"

      - name: Afficher les liens publics
        run: |
          echo "Installateur : ${SITE_URL}/downloads/${APP}/${APP}-${VERSION}.zip"
          echo "Dernier installateur : ${SITE_URL}/downloads/${APP}/${APP}-latest.zip"
          echo "Mise à jour : ${SITE_URL}/downloads/${APP}/${APP}-${VERSION}.lsu"
          echo "Dernière mise à jour : ${SITE_URL}/downloads/${APP}/${APP}-latest.lsu"
          echo "Manifeste en ligne : ${SITE_URL}/downloads/${APP}/latest.json"