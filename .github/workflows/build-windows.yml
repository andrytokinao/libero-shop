name: Build Windows Installer

on:
  push:
    branches:
      - "release-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (laisser vide pour la déduire du nom de la branche)"
        required: false
        default: ""
      publish_to_site:
        description: "Envoyer le zip sur le site web ?"
        type: boolean
        default: false

permissions:
  contents: read

env:
  APP_NAME: libero-shop                                        # nom de l'application (minuscules, tirets)
  VIDEO_PATH: assets/video/demo.mp4                            # vidéo optionnelle, ignorée si absente
  UPLOAD_URL: https://www.kinga-digital.com/api/upload-release # URL de l'API d'upload (sans le nom de l'app)
  SITE_URL: https://www.kinga-digital.com                      # utilisé pour afficher les liens publics

jobs:
  build-windows:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.ver.outputs.version }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout (branche courante)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Déterminer la version
        id: ver
        shell: pwsh
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if ($env:MANUAL_VERSION) {
            $v = $env:MANUAL_VERSION
          } else {
            $v = $env:BRANCH_NAME -replace '^release[-/]', ''
          }

          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Version invalide '$v' (branche '$($env:BRANCH_NAME)'). Format attendu : 1.0.23"
            exit 1
          }

          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Branche : $($env:BRANCH_NAME) -> Version : $v"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install WiX Toolset 3 (si absent)
        shell: pwsh
        run: choco install wixtoolset -y --no-progress
        continue-on-error: true

      - name: Build installer (profil installer)
        shell: pwsh
        run: mvn -B -P installer "-Drevision=${{ steps.ver.outputs.version }}" "-Dapp.version=${{ steps.ver.outputs.version }}" clean verify

      - name: Préparer le contenu du zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          $installers = Get-ChildItem -Recurse -Path target -Include *.exe,*.msi -File
          if (-not $installers) {
            Write-Error "Aucun installateur (.exe/.msi) trouvé dans backend/target"
            exit 1
          }
          $installers | ForEach-Object {
            Write-Host "Installateur : $($_.FullName)"
            Copy-Item $_.FullName -Destination $staging
          }

          $video = Join-Path $env:GITHUB_WORKSPACE $env:VIDEO_PATH
          if (Test-Path $video) {
            Copy-Item $video -Destination $staging
            Write-Host "Vidéo ajoutée : $video"
          } else {
            Write-Host "Pas de vidéo trouvée à $video, ignorée."
          }

          Get-ChildItem $staging | Select-Object Name, Length

      - name: Upload artifact (contenu à la racine)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.ver.outputs.version }}
          path: staging/*
          if-no-files-found: error
          retention-days: 30

  publish-site:
    needs: build-windows
    if: ${{ github.event_name == 'push' || inputs.publish_to_site }}
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.build-windows.outputs.version }}
      KINGA_UPLOAD_TOKEN: ${{ secrets.KINGA_UPLOAD_TOKEN }}   # seul secret nécessaire

    steps:
      - name: Télécharger l'artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ needs.build-windows.outputs.version }}
          path: dist

      - name: Créer le zip
        run: |
          cd dist
          zip -r "../${APP_NAME}-${VERSION}.zip" .
          cd ..
          ls -lh "${APP_NAME}-${VERSION}.zip"

      - name: Envoyer le zip par POST
        run: |
          ZIP="${APP_NAME}-${VERSION}.zip"
          echo "Envoi vers ${UPLOAD_URL%/}/${APP_NAME}"
          curl --fail-with-body -sS \
            --retry 3 --retry-all-errors --retry-delay 5 \
            -X POST "${UPLOAD_URL%/}/${APP_NAME}" \
            -H "Authorization: Bearer KINGA_UPLOAD_TOKEN" \
            -F "version=${VERSION}" \
            -F "file=@${ZIP};type=application/zip"

      - name: Afficher les liens publics
        run: |
          echo "Version  : ${SITE_URL}/downloads/${APP_NAME}/${APP_NAME}-${VERSION}.zip"
          echo "Dernière : ${SITE_URL}/downloads/${APP_NAME}/${APP_NAME}-latest.zip"