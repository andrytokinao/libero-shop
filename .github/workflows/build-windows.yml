name: Build Windows Installer

on:
  push:
    branches:
      - "release-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (laisser vide pour la déduire du nom de la branche)"
        required: false
        default: ""
      variant:
        description: "Variante, ex. moussa (laisser vide pour la déduire du nom de la branche)"
        required: false
        default: ""
      publish_to_site:
        description: "Envoyer le zip sur le site web ?"
        type: boolean
        default: false

permissions:
  contents: read

env:
  APP_NAME: libero-shop                                        # nom de base de l'application (minuscules, tirets)
  VIDEO_PATH: assets/video/demo.mp4                            # vidéo optionnelle, ignorée si absente
  UPLOAD_URL: https://www.kinga-digital.com/api/upload-release # URL de l'API d'upload (sans le nom de l'app)
  SITE_URL: https://www.kinga-digital.com                      # utilisé pour afficher les liens publics

jobs:
  build-windows:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.ver.outputs.version }}
      variant: ${{ steps.ver.outputs.variant }}
      app: ${{ steps.ver.outputs.app }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout (branche courante)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Déterminer la version et la variante
        id: ver
        shell: pwsh
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_VARIANT: ${{ inputs.variant }}
        run: |
          # Formats acceptés : release-1.0.23  ou  release-moussa-1.0.5
          $rest = $env:BRANCH_NAME -replace '^release[-/]', ''
          $variant = ""
          $v = ""

          if ($rest -match '^(?:(?<variant>[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*?)-)?(?<version>\d+\.\d+\.\d+)$') {
            $v = [string]$Matches['version']
            $variant = [string]$Matches['variant']
          }

          # Valeurs saisies à la main : prioritaires
          if ($env:MANUAL_VERSION) { $v = $env:MANUAL_VERSION }
          if ($env:MANUAL_VARIANT) { $variant = $env:MANUAL_VARIANT }
          $variant = $variant.ToLower()

          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Version introuvable dans la branche '$($env:BRANCH_NAME)'. Formats attendus : release-1.0.23 ou release-moussa-1.0.5"
            exit 1
          }
          if ($variant -and $variant -notmatch '^[a-z0-9]+(-[a-z0-9]+)*$') {
            Write-Error "Variante invalide '$variant' (minuscules, chiffres et tirets uniquement)"
            exit 1
          }

          $app = $env:APP_NAME
          if ($variant) { $app = "$app-$variant" }

          "version=$v" >> $env:GITHUB_OUTPUT
          "variant=$variant" >> $env:GITHUB_OUTPUT
          "app=$app" >> $env:GITHUB_OUTPUT
          Write-Host "Branche : $($env:BRANCH_NAME) -> Application : $app, Version : $v"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install WiX Toolset 3 (si absent)
        shell: pwsh
        run: choco install wixtoolset -y --no-progress
        continue-on-error: true

      - name: Build installer (profil installer)
        shell: pwsh
        run: mvn -B -P installer "-Drevision=${{ steps.ver.outputs.version }}" "-Dapp.version=${{ steps.ver.outputs.version }}" clean verify

      - name: Préparer le contenu du zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          $installers = Get-ChildItem -Recurse -Path target -Include *.exe,*.msi -File
          if (-not $installers) {
            Write-Error "Aucun installateur (.exe/.msi) trouvé dans backend/target"
            exit 1
          }
          $installers | ForEach-Object {
            Write-Host "Installateur : $($_.FullName)"
            Copy-Item $_.FullName -Destination $staging
          }

          $video = Join-Path $env:GITHUB_WORKSPACE $env:VIDEO_PATH
          if (Test-Path $video) {
            Copy-Item $video -Destination $staging
            Write-Host "Vidéo ajoutée : $video"
          } else {
            Write-Host "Pas de vidéo trouvée à $video, ignorée."
          }

          Get-ChildItem $staging | Select-Object Name, Length

      - name: Upload artifact (contenu à la racine)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.app }}-${{ steps.ver.outputs.version }}
          path: staging/*
          if-no-files-found: error
          retention-days: 30

  publish-site:
    needs: build-windows
    if: ${{ github.event_name == 'push' || inputs.publish_to_site }}
    runs-on: ubuntu-latest

    env:
      APP: ${{ needs.build-windows.outputs.app }}
      VERSION: ${{ needs.build-windows.outputs.version }}
      KINGA_UPLOAD_TOKEN: ${{ secrets.KINGA_UPLOAD_TOKEN }}   # seul secret nécessaire

    steps:
      - name: Télécharger l'artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.app }}-${{ needs.build-windows.outputs.version }}
          path: dist

      - name: Créer le zip
        run: |
          cd dist
          zip -r "../${APP}-${VERSION}.zip" .
          cd ..
          ls -lh "${APP}-${VERSION}.zip"

      - name: Envoyer le zip par POST
        run: |
          ZIP="${APP}-${VERSION}.zip"
          echo "Envoi vers ${UPLOAD_URL%/}/${APP}"
          curl --fail-with-body -sS \
            --retry 3 --retry-all-errors --retry-delay 5 \
            -X POST "${UPLOAD_URL%/}/${APP}" \
            -H "Authorization: Bearer KINGA_UPLOAD_TOKEN" \
            -F "version=${VERSION}" \
            -F "file=@${ZIP};type=application/zip"

      - name: Afficher les liens publics
        run: |
          echo "Version  : ${SITE_URL}/downloads/${APP}/${APP}-${VERSION}.zip"
          echo "Dernière : ${SITE_URL}/downloads/${APP}/${APP}-latest.zip"