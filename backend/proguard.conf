# =====================================================================
# ProGuard configuration for liberoshop (Spring Boot 4 / Java 21)
#
# Strategy: NAME-ONLY obfuscation (no shrinking, no optimization) so the
# Spring runtime keeps working. We rename the security-sensitive IP -- the
# business services and the license *logic* -- and -keep everything the
# framework reaches by reflection (JPA entities, Jackson DTOs, controllers,
# repositories, @Configuration/@Bean, @ConfigurationProperties, enums).
#
# This runs on the thin jar (our classes only) before spring-boot:repackage
# wraps it into the executable fat jar. Dependencies are passed to ProGuard
# as -libraryjars, so they are read but never touched.
# =====================================================================

# NB: do NOT add -dontpreverify. On Java 7+ classes need valid StackMapTable
# frames; skipping preverification makes ProGuard emit classes that throw
# java.lang.VerifyError at load time.
-dontshrink
-dontoptimize
-verbose
# Never emit class names that differ only by case (e.g. "a" and "A"). They
# collide on case-insensitive filesystems AND make Spring generate duplicate
# bean names once decapitalised. BackendApplication also uses a
# fully-qualified bean-name generator as the primary guard.
-dontusemixedcaseclassnames
-dontnote
# Library (JDK / Spring / ...) references we do not control: warn, do not fail.
-ignorewarnings
# Spring resolves classpath:/static, /templates ... keep the directory entries.
-keepdirectories

# --- Attributes Spring / JPA / Jackson read at runtime ---------------
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,Exceptions,Deprecated,Synthetic,SourceFile,LineNumberTable,RuntimeVisibleAnnotations,RuntimeInvisibleAnnotations,RuntimeVisibleParameterAnnotations,RuntimeInvisibleParameterAnnotations,RuntimeVisibleTypeAnnotations,RuntimeInvisibleTypeAnnotations,AnnotationDefault,MethodParameters,Record,PermittedSubclasses
# @PreAuthorize("#id ...") and Spring MVC rely on real parameter names.
-keepparameternames

# =====================================================================
# KEEP -- reflected by the framework, must NOT be renamed
# =====================================================================

# Application entry point (main + the listeners wired in it).
-keep class com.houssen.liberoshop.BackendApplication { *; }

# JPA entities: field names map to columns; @Enumerated(STRING) etc.
-keep class com.houssen.liberoshop.entity.** { *; }
# Web layer incl. DTOs: field / record-component names map to JSON.
-keep class com.houssen.liberoshop.web.** { *; }
# Spring Data repositories: proxied by type + derived-query method names.
-keep interface com.houssen.liberoshop.repository.** { *; }
-keep class com.houssen.liberoshop.repository.** { *; }
# These packages are left untouched by choice (not in the obfuscation scope).
-keep class com.houssen.liberoshop.security.** { *; }
-keep class com.houssen.liberoshop.backup.** { *; }
-keep class com.houssen.liberoshop.notification.** { *; }
-keep class com.houssen.liberoshop.server.** { *; }
-keep class com.houssen.liberoshop.util.** { *; }
-keep class com.houssen.liberoshop.bootstrap.** { *; }
-keep class com.houssen.liberoshop.desktop.** { *; }

# --- License package: keep the STRUCTURAL / data surface only --------
# (the logic classes below are deliberately NOT listed, so they get renamed)
-keep class com.houssen.liberoshop.license.LicenseController { *; }
-keep class com.houssen.liberoshop.license.LicenseConfiguration { *; }
-keep class com.houssen.liberoshop.license.LicenseConfiguration$* { *; }
-keep class com.houssen.liberoshop.license.LicenseProperties { *; }
-keep class com.houssen.liberoshop.license.LicenseExceptionHandler { *; }
-keep class com.houssen.liberoshop.license.LicenseStartupListener { *; }
-keep class com.houssen.liberoshop.license.LicenseEnforcementAdvisor { *; }
-keep class com.houssen.liberoshop.license.License { *; }
-keep class com.houssen.liberoshop.license.LicenseStatus { *; }
-keep class com.houssen.liberoshop.license.LicenseFile { *; }
-keep class com.houssen.liberoshop.license.LicenseState { *; }
-keep class com.houssen.liberoshop.license.LicensePlan { *; }
# @RequiresActiveLicense is an annotation type read reflectively by the advisor.
-keep class com.houssen.liberoshop.license.RequiresActiveLicense { *; }
-keep class com.houssen.liberoshop.license.exception.** { *; }

# --- Members Spring invokes reflectively on the RENAMED classes ------
# (services + license logic): keep annotated members wired even when renamed.
-keepclassmembers class com.houssen.liberoshop.** {
    @org.springframework.beans.factory.annotation.Autowired *;
    @org.springframework.beans.factory.annotation.Value *;
    @org.springframework.beans.factory.annotation.Qualifier *;
    @org.springframework.context.event.EventListener *;
    @org.springframework.scheduling.annotation.Scheduled *;
    @org.springframework.scheduling.annotation.Async *;
    @jakarta.annotation.PostConstruct *;
    @jakarta.annotation.PreDestroy *;
    @jakarta.annotation.Resource *;
}

# Enum constant names are serialized (JSON + JPA); keep members even when the
# enum type itself is renamed.
-keepclassmembers enum * {
    <fields>;
    public static **[] values();
    public static ** valueOf(java.lang.String);
}
