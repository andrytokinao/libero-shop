# Loaded ON TOP of the production src/main/resources/application.properties, not instead
# of it (config/ wins over the root of the classpath): the tests run with the settings
# the shop runs with -- open-in-view off, the same time zone and token rules -- and only
# what follows differs.

# A fresh in-memory database per test context, rather than the shop file in ./data.
# An empty URL lets Spring Boot create an embedded database with a unique name.
spring.datasource.url=
spring.jpa.hibernate.ddl-auto=create-drop

# Out of ./data and ./downloads, which belong to the developer's own running server.
liberoshop.security.jwt.secret-file=target/test-data/jwt-secret.key
liberoshop.security.recovery.code-file=target/test-data/recovery-code.txt
liberoshop.mobile.downloads-dir=target/test-data/downloads

# Integration tests must not require a signed license file on the build machine.
# Unit tests for the license module itself sign their own fixtures with a throwaway
# key pair and never rely on this setting.
liberoshop.license.enabled=false
liberoshop.license.renewal.enabled=false

# The starter dataset is opt-in, and several integration tests read its accounts and catalogue.
liberoshop.demo-data.enabled=true

# Out of ./data, which is the developer's own database folder.
liberoshop.security.first-password-file=target/first-password-test/first-password.txt
