spring.application.name=backend

# ---------------------------------------------------------------------------
# License module
#
# The signed .lic file is the only source of truth. Nothing here can grant or
# extend a license: the public key used to verify signatures is compiled into
# the application, not configured.
#
# The switches below are read ONLY from this file, the one packaged inside the
# jar. LicensePropertyGuard puts back the value written here whenever the same
# key arrives from the command line, an environment variable or an
# application.properties dropped next to the jar, and logs that it did. Without
# that, "--liberoshop.license.enabled=false" would be the whole attack.
#
# The evaluation period is capped separately, by TrialProperties.MAX_DAYS in the
# compiled code: trial.days below can shorten it, never lengthen it.
# ---------------------------------------------------------------------------

# Master switch. Must stay true on a customer installation.
liberoshop.license.enabled=true

# Location of the signed license file. Relative paths resolve against the
# working directory the application is started from.
liberoshop.license.path=./license/libero-shop.lic

# Records the latest date ever seen so that winding the system clock back does
# not extend the license. Stored beside the license file when left unset.
liberoshop.license.clock-guard.enabled=true

# Evaluation period granted when no .lic is installed. Set enabled=false for the
# strict behaviour: an unlicensed installation then refuses to start.
#
# The period is granted ONCE per machine. The day of the first run is recorded,
# authenticated against the machine fingerprint, in the application database AND
# in several files and registry values at once, so deleting the license folder
# does not hand out another 90 days. The database copy is the one that matters:
# the files can be located with a file monitor and wiped by a script, whereas
# dropping the database costs the customer their own sales and stock history.
# Keep system-wide=true: it is what spreads the file copies outside the install
# directory.
liberoshop.license.trial.enabled=true
liberoshop.license.trial.days=90
liberoshop.license.trial.system-wide=true
#liberoshop.license.trial.path=./license/.license-trial

# ---------------------------------------------------------------------------
# Optional online renewal
#
# Disabled by default. Enable it once the publisher's endpoint is deployed: it
# lets a customer who has paid get a renewed license without any manual step.
# A failed call is never fatal, the installed license simply stays in force.
# ---------------------------------------------------------------------------
liberoshop.license.renewal.enabled=false
#liberoshop.license.renewal.endpoint=https://licences.houssen.mg/api/v1/renew
#liberoshop.license.renewal.interval-days=21
#liberoshop.license.renewal.urgent-within-days=30
#liberoshop.license.renewal.timeout=10s

# ---------------------------------------------------------------------------
# Database
#
# File-based H2 so a restart keeps the shop's sales, stock -- and the trial
# record the license module writes here, which an in-memory database would hand
# back fresh on every start. Swap the three lines below for the MySQL or
# PostgreSQL coordinates on a real installation: both drivers are already on the
# classpath, nothing else changes.
# ---------------------------------------------------------------------------
# Plain file URL, no DB_CLOSE_DELAY and no AUTO_SERVER: those two are for
# in-memory databases and for sharing a file between JVMs. Together on a file
# database they let the engine close underneath an idle pooled connection, and
# the next write fails with "the database has been closed".
# The file keeps the product's former name on purpose. It is an internal artefact
# nobody reads, and pointing the URL at a new name would leave every installation
# already selling in front of an empty database, its own sales and stock still on
# disk under the old file. Rename it only alongside a documented copy step.
spring.datasource.url=jdbc:h2:file:./data/libertyshop
spring.datasource.username=sa
spring.datasource.password=

# "update" suits the shop-floor installs this product targets: no DBA, no
# migration step. Move to Flyway or Liquibase before the first customer upgrade
# that has to preserve data through a schema change.
spring.jpa.hibernate.ddl-auto=update
# Lazy associations are loaded inside the services, never while the response is
# being written: a view that triggers its own queries hides N+1 problems and
# turns a serialisation error into a half-written response.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Security
#
# Authentication is by bearer token: POST /api/auth/login returns a signed JWT
# and the front end sends it back in the Authorization header. Nothing is stored
# server side, so there is no session to expire and no cookie to protect.
#
# allowed-origins is only for development, when the UI runs under "ng serve" on
# another port. Leave it EMPTY in production: the SPA is then served by this
# same application, the origin matches, and no cross-origin call is permitted.
# ---------------------------------------------------------------------------
liberoshop.security.allowed-origins=http://localhost:4200

# The origins of the mobile app's web view. This app's Android build serves its
# pages from http://localhost (androidScheme "http" in ui/capacitor.config.ts,
# so it may call a plain-HTTP server on the local network); https://localhost
# is Capacitor's default and capacitor://localhost is iOS. Unlike the
# line above, these belong in production. Admitting them lets those pages CALL
# the API; they still need a token to be answered, and a token is only handed
# out against a password. Empty the list to refuse the mobile app altogether.
liberoshop.security.mobile-origins=http://localhost,https://localhost,capacitor://localhost

# ---------------------------------------------------------------------------
# Mobile app
#
# The Android APK is published by copying it into this folder (relative to the
# directory the server is started from), under the name below. It is served at
# /downloads/<name>, to anyone who can reach the server, and the "Application
# mobile" admin screen shows a QR code pointing at it. No restart is needed to
# publish a new one. See docs/mobile-android.md.
# ---------------------------------------------------------------------------
liberoshop.mobile.downloads-dir=./downloads
liberoshop.mobile.apk-file=libero-shop.apk

# Secret signing the tokens (HS256). At least 32 characters.
#
# Left empty here, which is right for development and WRONG on a customer
# installation: an empty value makes the application generate a random key at
# each start, so every restart signs everyone out. Set it once per installation,
# and keep it out of source control by reading it from the environment:
#   liberoshop.security.jwt.secret=${LIBEROSHOP_JWT_SECRET:}
# Changing it later invalidates every token already handed out -- which is also
# how you sign everybody out on purpose.
liberoshop.security.jwt.secret=

# Lifetime of a token. There is no refresh token: when this runs out the user
# signs in again, so it is sized on a shift at the till rather than on a
# round trip. Shorten it to reduce the window in which a stolen token is usable.
liberoshop.security.jwt.ttl=12h

# Checked again on every incoming token, so one signed by another application
# that happens to share the secret is still refused.
liberoshop.security.jwt.issuer=libero-shop

# ---------------------------------------------------------------------------
# Starter dataset
#
# Inserted ONLY when the database is empty, so restarts never duplicate it and a
# shop that has begun trading is never touched. Set enabled=false once the real
# accounts and catalogue exist.
#
# Accounts created: fatima / hary (caisse), joseph (depot), nadia (responsable
# depot), mparany (super admin) -- all with the password below.
# ---------------------------------------------------------------------------
liberoshop.demo-data.enabled=true
liberoshop.demo-data.password=vaha2026

# ---------------------------------------------------------------------------
# Front end: the Angular build is copied into classpath:/static by the Maven build
# and served by SpaWebConfiguration, which also answers index.html for the app's
# routes. Boot's own /** static mapping is turned off so there is only one.
# ---------------------------------------------------------------------------
spring.web.resources.add-mappings=false
