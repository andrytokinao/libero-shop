spring.application.name=backend

# ---------------------------------------------------------------------------
# License module
#
# The signed .lic file is the only source of truth. Nothing here can grant or
# extend a license: the public key used to verify signatures is compiled into
# the application, not configured.
#
# The switches below are read ONLY from this file, the one packaged inside the
# jar. LicensePropertyGuard puts back the value written here whenever the same
# key arrives from the command line, an environment variable or an
# application.properties dropped next to the jar, and logs that it did. Without
# that, "--libertyshop.license.enabled=false" would be the whole attack.
#
# The evaluation period is capped separately, by TrialProperties.MAX_DAYS in the
# compiled code: trial.days below can shorten it, never lengthen it.
# ---------------------------------------------------------------------------

# Master switch. Must stay true on a customer installation.
libertyshop.license.enabled=true

# Location of the signed license file. Relative paths resolve against the
# working directory the application is started from.
libertyshop.license.path=./license/liberty-shop.lic

# Records the latest date ever seen so that winding the system clock back does
# not extend the license. Stored beside the license file when left unset.
libertyshop.license.clock-guard.enabled=true

# Evaluation period granted when no .lic is installed. Set enabled=false for the
# strict behaviour: an unlicensed installation then refuses to start.
#
# The period is granted ONCE per machine. The day of the first run is recorded,
# authenticated against the machine fingerprint, in the application database AND
# in several files and registry values at once, so deleting the license folder
# does not hand out another 90 days. The database copy is the one that matters:
# the files can be located with a file monitor and wiped by a script, whereas
# dropping the database costs the customer their own sales and stock history.
# Keep system-wide=true: it is what spreads the file copies outside the install
# directory.
libertyshop.license.trial.enabled=true
libertyshop.license.trial.days=90
libertyshop.license.trial.system-wide=true
#libertyshop.license.trial.path=./license/.license-trial

# ---------------------------------------------------------------------------
# Optional online renewal
#
# Disabled by default. Enable it once the publisher's endpoint is deployed: it
# lets a customer who has paid get a renewed license without any manual step.
# A failed call is never fatal, the installed license simply stays in force.
# ---------------------------------------------------------------------------
libertyshop.license.renewal.enabled=false
#libertyshop.license.renewal.endpoint=https://licences.houssen.mg/api/v1/renew
#libertyshop.license.renewal.interval-days=21
#libertyshop.license.renewal.urgent-within-days=30
#libertyshop.license.renewal.timeout=10s

# ---------------------------------------------------------------------------
# Database
#
# File-based H2 so a restart keeps the shop's sales, stock -- and the trial
# record the license module writes here, which an in-memory database would hand
# back fresh on every start. Swap the three lines below for the MySQL or
# PostgreSQL coordinates on a real installation: both drivers are already on the
# classpath, nothing else changes.
# ---------------------------------------------------------------------------
# Plain file URL, no DB_CLOSE_DELAY and no AUTO_SERVER: those two are for
# in-memory databases and for sharing a file between JVMs. Together on a file
# database they let the engine close underneath an idle pooled connection, and
# the next write fails with "the database has been closed".
spring.datasource.url=jdbc:h2:file:./data/libertyshop
spring.datasource.username=sa
spring.datasource.password=

# "update" suits the shop-floor installs this product targets: no DBA, no
# migration step. Move to Flyway or Liquibase before the first customer upgrade
# that has to preserve data through a schema change.
spring.jpa.hibernate.ddl-auto=update
# Lazy associations are loaded inside the services, never while the response is
# being written: a view that triggers its own queries hides N+1 problems and
# turns a serialisation error into a half-written response.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Security
#
# Authentication is session based: the browser holds an HttpOnly JSESSIONID and
# every mutating call must echo the XSRF-TOKEN cookie back in a header.
#
# allowed-origins is only for development, when the UI runs under "ng serve" on
# another port. Leave it EMPTY in production: the SPA is then served by this
# same application, the origin matches, and no cross-origin call is permitted.
# ---------------------------------------------------------------------------
libertyshop.security.allowed-origins=http://localhost:4200
libertyshop.security.secure-cookies=false

# ---------------------------------------------------------------------------
# Starter dataset
#
# Inserted ONLY when the database is empty, so restarts never duplicate it and a
# shop that has begun trading is never touched. Set enabled=false once the real
# accounts and catalogue exist.
#
# Accounts created: fatima / hary (caisse), joseph (depot), nadia (responsable
# depot), mparany (super admin) -- all with the password below.
# ---------------------------------------------------------------------------
libertyshop.demo-data.enabled=true
