spring.application.name=backend

# ---------------------------------------------------------------------------
# Database
#
# File-based H2 so a restart keeps the shop's sales and stock, which an in-memory
# database would hand back fresh on every start. Swap the three lines below for the MySQL or
# PostgreSQL coordinates on a real installation: both drivers are already on the
# classpath, nothing else changes.
# ---------------------------------------------------------------------------
# Plain file URL, no DB_CLOSE_DELAY and no AUTO_SERVER: those two are for
# in-memory databases and for sharing a file between JVMs. Together on a file
# database they let the engine close underneath an idle pooled connection, and
# the next write fails with "the database has been closed".
# The file keeps the product's former name on purpose. It is an internal artefact
# nobody reads, and pointing the URL at a new name would leave every installation
# already selling in front of an empty database, its own sales and stock still on
# disk under the old file. Rename it only alongside a documented copy step.
spring.datasource.url=jdbc:h2:file:./data/libertyshop
spring.datasource.username=sa
spring.datasource.password=

# "update" suits the shop-floor installs this product targets: no DBA, no
# migration step. Move to Flyway or Liquibase before the first customer upgrade
# that has to preserve data through a schema change.
spring.jpa.hibernate.ddl-auto=update
# Lazy associations are loaded inside the services, never while the response is
# being written: a view that triggers its own queries hides N+1 problems and
# turns a serialisation error into a half-written response.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Security
#
# Authentication is by bearer token: POST /api/auth/login returns a signed JWT
# and the front end sends it back in the Authorization header. Nothing is stored
# server side, so there is no session to expire and no cookie to protect.
#
# allowed-origins is only for development, when the UI runs under "ng serve" on
# another port. Leave it EMPTY in production: the SPA is then served by this
# same application, the origin matches, and no cross-origin call is permitted.
# ---------------------------------------------------------------------------
liberoshop.security.allowed-origins=http://localhost:4200

# The origins of the mobile app's web view. This app's Android build serves its
# pages from http://localhost (androidScheme "http" in ui/capacitor.config.ts,
# so it may call a plain-HTTP server on the local network); https://localhost
# is Capacitor's default and capacitor://localhost is iOS. Unlike the
# line above, these belong in production. Admitting them lets those pages CALL
# the API; they still need a token to be answered, and a token is only handed
# out against a password. Empty the list to refuse the mobile app altogether.
liberoshop.security.mobile-origins=http://localhost,https://localhost,capacitor://localhost

# The reverse proxies in front of this server, by IP address, comma-separated.
# EMPTY when the tills reach the server directly -- the normal installation.
# Behind a proxy (TLS termination, a tunnel), every request arrives from the
# proxy's address: list it here so the sign-in slow-down counts the attempts of
# each device, read from X-Forwarded-For, instead of slowing everybody at once.
# Only a request coming from one of these addresses has that header believed.
# Example for a proxy on the same machine: 127.0.0.1,::1
liberoshop.security.trusted-proxies=

# ---------------------------------------------------------------------------
# Mobile app
#
# The Android APK is published by copying it into this folder (relative to the
# directory the server is started from), under the name below. It is served at
# /downloads/<name>, to anyone who can reach the server, and the public
# "Application mobile" page (/application-mobile) shows a QR code pointing at
# it. No restart is needed to publish a new one. See docs/mobile-android.md.
#
# An installed server also carries the APK it was built with, inside its own
# folder (liberoshop.mobile.bundled-apk, set by src/main/jpackage/runtime.args):
# the download works before anything has been copied. Of the two files, the
# phones get the more recent one.
# ---------------------------------------------------------------------------
liberoshop.mobile.downloads-dir=./downloads
liberoshop.mobile.apk-file=libero-shop.apk

# The server's address on the Internet, for phones away from the shop (4G, at
# home), e.g. https://boutique.example.com -- only once the box forwards a port
# to this machine or a reverse proxy publishes it. Empty: the "Internet" choice
# of the download page says it is not available, and only the shop's Wi-Fi works.
liberoshop.mobile.public-url=${LIBEROSHOP_PUBLIC_URL:}

# Secret signing the tokens (HS256).
#
# Each installation generates its own at its first start and keeps it in the file
# below, so a restart does not sign anyone out and no two shops share a key.
# Nothing to do by hand. Relative paths resolve against the directory the server
# is started from; the installers move it under the user's home (see
# src/main/jpackage/runtime.args).
#
# Deleting that file signs everybody out: the next start generates another.
# It is as secret as the database beside it -- never commit or e-mail it.
liberoshop.security.jwt.secret-file=./data/jwt-secret.key

# For whoever administers the machine and prefers to hold the secret: set the
# LIBEROSHOP_JWT_SECRET environment variable (at least 32 characters) and it is
# used instead of the file, which is then neither read nor written.
liberoshop.security.jwt.secret=${LIBEROSHOP_JWT_SECRET:}

# A lost administrator password is replaced from the server's own computer: the
# "Mot de passe administrateur oublie" page writes a one-time code into this file,
# and asks for it back. The file is deleted once used. The installers move it
# beside the signing key (see src/main/jpackage/runtime.args).
liberoshop.security.recovery.code-file=./data/recovery-code.txt

# An installation with no account opens one by itself, "admin", with a password
# drawn at random and kept in this file: the login page shows it, at the server's
# own computer only, until its holder has replaced it -- which the screens ask
# for at the first sign-in. The file is then deleted. Moved beside the signing
# key by the installers as well.
liberoshop.security.first-password-file=./data/first-password.txt

# Lifetime of a token, sized on a shift at the till. A screen in use renews it
# before it runs out (POST /api/auth/renew); an idle one is warned, then signed
# out. Shorten it to reduce the window in which a stolen token is usable.
liberoshop.security.jwt.ttl=12h

# The shop's time zone, which "today" is counted in (dashboards, daily sales,
# reports), e.g. Indian/Antananarivo. Empty: the zone of the server computer.
liberoshop.time-zone=

# Checked again on every incoming token, so one signed by another application
# that happens to share the secret is still refused.
liberoshop.security.jwt.issuer=libero-shop

# ---------------------------------------------------------------------------
# Starter dataset
#
# OFF here, and it must stay off in what is shipped: the dataset creates accounts
# -- a super admin among them -- whose password is written in this repository.
# An installation without it starts with no account at all, and its login page
# asks the first person at the server's computer to create the administrator
# (see web/SetupController).
#
# For development and demonstrations, start with the "dev" profile instead of
# editing this line: application-dev.properties turns it on.
#   mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#   (IntelliJ: "Active profiles" = dev in the run configuration)
# Even then it is inserted ONLY when the database is empty, so restarts never
# duplicate it and a shop that has begun trading is never touched.
# ---------------------------------------------------------------------------
liberoshop.demo-data.enabled=false

# ---------------------------------------------------------------------------
# Application updates
#
# A new version arrives as a signed .lsu file. An administrator can always upload
# one from the hidden page /admin/mise-a-jour, with no setting below. The settings
# here govern only the AUTOMATIC channel, which stays off until it is both enabled
# and given a URL to look at.
#
# The server replaces its own code and restarts: it keeps the previous version so
# it can roll back, and -- when require-confirmation is on -- asks every connected
# screen to agree before it cuts off, so a till is never interrupted unannounced.
# See docs/23-mise-a-jour-de-l-application.md.
# ---------------------------------------------------------------------------
# Master switch for automatic checks. OFF: the install never reaches out on its
# own; the upload page and the "check now" button still work by hand.
liberoshop.update.enabled=${LIBEROSHOP_UPDATE_ENABLED:false}

# Where to fetch the update manifest (a small JSON pointing at the latest .lsu).
# EMPTY disables every online operation -- check, download and automatic updates --
# regardless of the switch above; uploading a file by hand is unaffected.
liberoshop.update.url=${LIBEROSHOP_UPDATE_URL:}

# Time of day the automatic check runs, once a day. Default outside trading hours.
liberoshop.update.check-time=${LIBEROSHOP_UPDATE_CHECK_TIME:03:00}

# Whether an automatic update waits for every connected screen to agree before it
# cuts the server off. ON: a till is never interrupted without someone saying so.
liberoshop.update.require-confirmation=true

# How long to wait for those agreements before leaving the update for next time.
liberoshop.update.confirmation-timeout=5m

# An uploaded .lsu carries the whole application jar (tens of megabytes), well over
# the 1 MB default. Raised here so the hidden update page can accept one; the other
# uploads (a catalogue, a photo) stay far below this.
spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=250MB


spring.web.resources.add-mappings=false
