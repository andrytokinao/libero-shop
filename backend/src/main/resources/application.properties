spring.application.name=backend

# ---------------------------------------------------------------------------
# License module
#
# The signed .lic file is the only source of truth. Nothing here can grant or
# extend a license: the public key used to verify signatures is compiled into
# the application, not configured.
# ---------------------------------------------------------------------------

# Master switch. Must stay true on a customer installation.
libertyshop.license.enabled=true

# Location of the signed license file. Relative paths resolve against the
# working directory the application is started from.
libertyshop.license.path=./license/liberty-shop.lic

# Records the latest date ever seen so that winding the system clock back does
# not extend the license. Stored beside the license file when left unset.
libertyshop.license.clock-guard.enabled=true

# ---------------------------------------------------------------------------
# Optional online renewal
#
# Disabled by default. Enable it once the publisher's endpoint is deployed: it
# lets a customer who has paid get a renewed license without any manual step.
# A failed call is never fatal, the installed license simply stays in force.
# ---------------------------------------------------------------------------
libertyshop.license.renewal.enabled=false
#libertyshop.license.renewal.endpoint=https://licences.houssen.mg/api/v1/renew
#libertyshop.license.renewal.interval-days=21
#libertyshop.license.renewal.urgent-within-days=30
#libertyshop.license.renewal.timeout=10s
