<!DOCTYPE html>
<!--
  Gabarit PDF d'une facture (Thymeleaf -> OpenHTMLtoPDF), templates/pdf/invoice.html.
  Contraintes du moteur : XHTML bien formé (balises fermées, <br/>, <meta .../>), CSS 2.1,
  pas de flexbox/grid, pas de &nbsp; (utiliser &#160;).
  Le modèle est un InvoiceDocument (record) : on appelle ses méthodes, ex. ${invoice.number()}.
-->
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <title th:text="'Facture ' + ${invoice.number()}">Facture</title>
    <style>
        @page {
            size: A4;
            margin: 18mm 15mm 22mm 15mm;
            @bottom-center {
                content: "Page " counter(page) " / " counter(pages);
                font-family: Helvetica, Arial, sans-serif;
                font-size: 8pt;
                color: #777777;
            }
        }
        body {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 10pt;
            color: #222222;
        }
        table { border-collapse: collapse; width: 100%; }
        td, th { vertical-align: top; }

        .header td { padding: 0; }
        .shop-name { font-size: 20pt; font-weight: bold; color: #1b4f72; }
        .shop-info { font-size: 9pt; color: #555555; padding-top: 2pt; }
        .doc-title { font-size: 16pt; font-weight: bold; text-align: right; }
        .doc-meta { text-align: right; font-size: 9pt; color: #555555; padding-top: 2pt; }
        .status {
            display: inline-block;
            margin-top: 4pt;
            padding: 2pt 8pt;
            font-size: 9pt;
            font-weight: bold;
        }
        .status.ok { border: 1px solid #1e8449; color: #1e8449; }
        .status.open { border: 1px solid #b9770e; color: #b9770e; }

        .rule { border-top: 2px solid #1b4f72; margin: 12pt 0; }

        .cancelled {
            margin-bottom: 12pt;
            padding: 6pt;
            border: 2px solid #b03a2e;
            color: #b03a2e;
            font-size: 11pt;
            font-weight: bold;
            text-align: center;
        }

        .parties { margin-bottom: 14pt; }
        .parties td { width: 50%; padding: 0; }
        .label { font-size: 8pt; color: #777777; text-transform: uppercase; }
        .party-name { font-size: 12pt; font-weight: bold; }

        .lines th {
            background-color: #1b4f72;
            color: #ffffff;
            font-size: 9pt;
            text-align: left;
            padding: 6pt;
        }
        .lines td { padding: 6pt; border-bottom: 1px solid #dddddd; }
        .lines tr.alt td { background-color: #f4f7fa; }
        .num { text-align: right; white-space: nowrap; }
        .qty { text-align: center; white-space: nowrap; }
        .lines tr { page-break-inside: avoid; }

        .totals { width: 55%; margin-left: 45%; margin-top: 10pt; page-break-inside: avoid; }
        .totals td { padding: 4pt 6pt; }
        .totals .grand td {
            border-top: 2px solid #1b4f72;
            font-size: 12pt;
            font-weight: bold;
            color: #1b4f72;
        }

        .thanks { margin-top: 24pt; text-align: center; font-size: 9pt; color: #777777; }
    </style>
</head>
<body>

<table class="header">
    <tr>
        <td>
            <div class="shop-name" th:text="${invoice.shop().name()}">LIBERO SHOP</div>
            <div class="shop-info" th:if="${!invoice.shop().address().isEmpty()}" th:text="${invoice.shop().address()}">Adresse</div>
            <div class="shop-info" th:if="${!invoice.shop().contact().isEmpty()}" th:text="${invoice.shop().contact()}">Contact</div>
        </td>
        <td>
            <div class="doc-title">FACTURE</div>
            <div class="doc-meta" th:text="'N° ' + ${invoice.number()}">N° FAC-0000</div>
            <div class="doc-meta" th:text="${invoice.date()}">01/01/2026 10:00</div>
            <div class="doc-meta">
                <span class="status ok" th:classappend="${!invoice.paid()} ? 'open'" th:text="${invoice.status()}">Payée</span>
            </div>
        </td>
    </tr>
</table>

<div class="rule"></div>

<div class="cancelled" th:if="${invoice.cancelledOn() != null}" th:text="${invoice.cancelledOn()}">FACTURE ANNULÉE</div>

<table class="parties">
    <tr>
        <td>
            <div th:if="${invoice.customerName() != null}">
                <div class="label">Client</div>
                <div class="party-name" th:text="${invoice.customerName()}">Nom du client</div>
            </div>
        </td>
        <td>
            <div th:if="${invoice.sellerName() != null}">
                <div class="label">Vendeur</div>
                <div class="party-name" th:text="${invoice.sellerName()}">Nom du vendeur</div>
            </div>
        </td>
    </tr>
</table>

<table class="lines">
    <thead>
    <tr>
        <th style="width: 6%;">#</th>
        <th>Produit</th>
        <th class="qty" style="width: 16%;">Quantité</th>
        <th class="num" style="width: 19%;">Prix unitaire</th>
        <th class="num" style="width: 19%;">Total</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="line : ${invoice.lines()}" th:classappend="${line.index() % 2 == 0} ? 'alt'">
        <td th:text="${line.index()}">1</td>
        <td th:text="${line.label()}">Produit</td>
        <td class="qty" th:text="${line.quantity()}">1</td>
        <td class="num" th:text="${line.unitPrice()}">0 Ar</td>
        <td class="num" th:text="${line.total()}">0 Ar</td>
    </tr>
    </tbody>
</table>

<table class="totals">
    <tr class="grand">
        <td>Total</td>
        <td class="num" th:text="${invoice.total()}">0 Ar</td>
    </tr>
</table>

<div class="thanks">Merci de votre visite.</div>

</body>
</html>
